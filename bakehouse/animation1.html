  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Dancing+Script:wght@400;700&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Righteous&display=swap" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One:wght@400&display=swap');
        
      

        .bakery-container {
            position: relative;
            text-align: center;
        }

        .bakery-text {
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 0.1em;
            position: relative;
            z-index: 2;
        }

        .bake-part {
            font-family: 'Righteous', sans-serif;
            display: inline-block;
            background: linear-gradient(45deg, #000000, #2e1c00, #130f00, #ffba6b);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 3s ease-in-out infinite, bounce 2s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(255, 107, 107, 0.5);
        }

        .ry-part {
            display: inline-block;
            color: #8b4513;
            animation: glow 2s ease-in-out infinite alternate;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        /* Floating bread elements */
        .bread-icon {
            position: absolute;
            font-size: 2rem;
            animation: float 4s ease-in-out infinite;
            opacity: 0.8;
        }

        .bread-1 {
            top: 70%;
            left: 70%;
            animation-delay: 0s;
        }

        .bread-2 {
            top: 80%;
            right: 100%;
            animation-delay: 1s;
        }

        .bread-3 {
            bottom: 90%;
            left: 20%;
            animation-delay: 2s;
        }

        .bread-4 {
            bottom: 75%;
            right: 80%;
            animation-delay: 3s;
        }

        /* Sparkle effect */
        .sparkles {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .sparkle {
            position: absolute;
            color: #ffd700;
            font-size: 1rem;
            animation: sparkle 1.5s ease-in-out infinite;
        }

        .sparkle:nth-child(1) { top: -100px; left: -150px; animation-delay: 0s; }
        .sparkle:nth-child(2) { top: -80px; left: 120px; animation-delay: 0.3s; }
        .sparkle:nth-child(3) { top: 50px; left: -100px; animation-delay: 0.6s; }
        .sparkle:nth-child(4) { top: 80px; left: 150px; animation-delay: 0.9s; }
        .sparkle:nth-child(5) { top: -50px; left: 0px; animation-delay: 1.2s; }

        /* Steam effect */
        .steam {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
        }

        .steam-line {
            position: absolute;
            width: 4px;
            height: 40px;
            background: linear-gradient(to top, rgba(255,255,255,0), rgba(255,255,255,0.8), rgba(255,255,255,0));
            border-radius: 2px;
            animation: steam-rise 2s ease-in-out infinite;
        }

        .steam-line:nth-child(1) { left: -20px; animation-delay: 0s; }
        .steam-line:nth-child(2) { left: 0px; animation-delay: 0.3s; }
        .steam-line:nth-child(3) { left: 20px; animation-delay: 0.6s; }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0px); }
            25% { transform: translateY(-5px); }
            75% { transform: translateY(5px); }
        }

        @keyframes glow {
            0% { text-shadow: 2px 2px 4px rgba(0,0,0,0.3), 0 0 10px rgba(139, 69, 19, 0.3); }
            100% { text-shadow: 2px 2px 4px rgba(0,0,0,0.3), 0 0 20px rgba(139, 69, 19, 0.6); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            25% { transform: translateY(-10px) rotate(2deg); }
            50% { transform: translateY(0px) rotate(0deg); }
            75% { transform: translateY(-5px) rotate(-2deg); }
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0) rotate(0deg); }
            50% { opacity: 1; transform: scale(1) rotate(180deg); }
        }

        @keyframes steam-rise {
            0% { opacity: 0; transform: translateY(0px) scaleX(1); }
            50% { opacity: 0.8; transform: translateY(-20px) scaleX(1.5); }
            100% { opacity: 0; transform: translateY(-40px) scaleX(0.5); }
        }

        /* Hover effects */
        .bakery-text:hover .bake-part {
            animation-duration: 1s;
            transform: scale(1.05);
        }

        .bakery-text:hover .ry-part {
            animation-duration: 1s;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .bakery-text {
                font-size: 1rem;
            }
            
            .bread-icon {
                font-size: 1.5rem;
            }
            
            .sparkle {
                font-size: 0.8rem;
            }
        }
    </style>

    <div class="bakery-container">
        <!-- Floating bread elements -->
        <div class="bread-icon bread-1">🥖</div>
        <div class="bread-icon bread-2">🥐</div>
        <div class="bread-icon bread-3">🍞</div>
        <div class="bread-icon bread-4">🥯</div>
        
        <!-- Main text -->
        <h1 class="bakery-text">
            <span class="bake-part">Find Your</span><span class="ry-part">Bake</span>
        </h1>
        
        <!-- Steam effect -->
        <div class="steam">
            <div class="steam-line"></div>
            <div class="steam-line"></div>
            <div class="steam-line"></div>
        </div>
        
        <!-- Sparkle effect -->
        <div class="sparkles">
            <div class="sparkle">✨</div>
            <div class="sparkle">⭐</div>
            <div class="sparkle">✨</div>
            <div class="sparkle">⭐</div>
            <div class="sparkle">✨</div>
        </div>
    </div>
